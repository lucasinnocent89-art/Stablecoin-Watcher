name: Stablecoin Watcher
 
on:
  schedule:
    # Runs every 6 hours. Edit the cron expression to change frequency.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab
 
permissions:
  contents: write  # needed so the workflow can commit updated seen_coins.json
 
jobs:
  run-watcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_RISK_SCORE: "5.0"
          ALWAYS_ALERT_NEW_COINS: "false"
        run: python watcher.py
 
      - name: Commit updated seen_coins.json
        run: |
          git config user.name "stablecoin-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_coins.json
          git diff --staged --quiet || git commit -m "update seen coins [skip ci]"
          git push
 
